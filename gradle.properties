# Fail fast on unreachable repositories instead of hanging the build / IDE sync.
# (Gradle's default is 30s each, which makes a single dead repo stall syncs for a long time.)
systemProp.org.gradle.internal.http.connectionTimeout=15000
systemProp.org.gradle.internal.http.socketTimeout=15000

# Performance / quality-of-life.
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
